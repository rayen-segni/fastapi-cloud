name: FastAPI Cloud Deploy

author: Rayen Segni

description: Deploy a FastAPI application to FastAPI Cloud from GitHub Actions.

inputs:
  app-id:
    description: App ID from FastAPI CLoud Project
    required: true

  token:
    description: Used for authentication. You can find it in your fastapi account settings
    required: true

  working-directory:
    description: Path to the App Directory
    required: false
    default: "./"

  not-wait:
    description: Triggers the deployment and immediately exits without waiting for the build and deployment status to finish.
    required: false
    default: "false"

runs:
  using: composite
  steps:
  - name: Deploy to FastAPI Cloud
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    env:
      FASTAPI_CLOUD_APP_ID: ${{ inputs.app-id }}
      FASTAPI_CLOUD_TOKEN: ${{ inputs.token }}
      INPUT_NO_WAIT: ${{ inputs.no-wait }}
    run: |
      # Mask secret in runner logs
      echo "::add-mask::$FASTAPI_CLOUD_TOKEN"

      # Validate required inputs upfront
      if [ -z "$FASTAPI_CLOUD_TOKEN" ]; then
        echo "::error::Missing required input: token (or secret FASTAPI_CLOUD_TOKEN)"
        exit 1
      fi

      if [ -z "$FASTAPI_CLOUD_APP_ID" ]; then
        echo "::error::Missing required input: app-id"
        exit 1
      fi

      # Ensure fastapi CLI is available
      if ! command -v fastapi &> /dev/null; then
        echo "Installing FastAPI CLI..."
        pipx install "fastapi[standard]"
      fi

      EXTRA_ARGS=()
      if [ "$INPUT_NO_WAIT" = "true" ]; then
        EXTRA_ARGS+=(--no-wait)
      fi

      echo "Deploying application to FastAPI Cloud (App ID: $FASTAPI_CLOUD_APP_ID)..."
      fastapi cloud deploy "${EXTRA_ARGS[@]}"



branding:
  icon: upload-cloud
  color: green